name: CI

# Quality + tests on every PR, every push to main, and every v* tag. Non-PR
# runs also build the panel image for linux/amd64 + linux/arm64 and publish it
# to GHCR, on one of two channels:
#
#   push to main (every merge)  ->  :edge  + :sha-<7 char commit>
#   push of a v<semver> tag     ->  :latest + :v<semver>, then a GitHub Release
#   PR from a branch here       ->  :branch-<branch name> + :sha-<7 char commit>
#   manual run on a branch      ->  :branch-<branch name> + :sha-<7 char commit>
#
# Branch images are for trying a branch on a real host before it merges: every
# push to a PR opened from a branch in this repo publishes :branch-feat-my-thing
# once checks + tests pass (or run `gh workflow run ci.yml --ref feat/my-thing`
# for a branch with no PR). They never touch :edge or :latest. On a PR, the
# merge job also keeps one comment on the PR up to date with the image tags. PRs from forks
# never publish: they get the build-only docker-build check instead.
#
# So :latest and :v<version> only ever move when a release is tagged, and every
# merged commit stays pullable by its :sha- tag. The docker/merge/release jobs
# all `needs` checks + tests, so untested code never ships - and since the
# checks run once per event and the publish jobs reuse those results, there's
# no duplicated test run.
#
# Cutting a release: bump package.json + CHANGELOG.md in a PR, merge it, then
# `git tag v<version> <merge commit> && git push origin v<version>`. The tag
# must match package.json or the run fails before anything is published.
#
# Each arch builds on its OWN native runner and pushes an untagged, by-digest
# image; the merge job then stitches the two digests into one manifest list.
# Emulating arm64 on an amd64 runner is not an option here: Node/V8 hits
# instructions qemu-user mis-emulates and `pnpm install` dies with
# "uncaught target signal 4 (Illegal instruction)", then hangs until the job
# is cancelled.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # Serialize per-ref; only cancel stale PR runs - never an in-flight publish
  # (a superseded push should not kill a build mid-upload).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: the PR-facing jobs run untrusted code, so the
# workflow token they see is read-only. Only the publish jobs below escalate.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # Skip the postinstall CSS build - `pnpm run build` below is the gate and
      # rebuilds it anyway, so letting postinstall run just does Tailwind twice.
      - run: pnpm install --frozen-lockfile
        env:
          MSM_SKIP_POSTINSTALL: '1'
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run build

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # The unit suite is headless (no rendered CSS needed), so skip the
      # postinstall Tailwind build here too.
      - run: pnpm install --frozen-lockfile
        env:
          MSM_SKIP_POSTINSTALL: '1'
      - run: pnpm test

  # PRs never reach the publish `docker` job below, so without this the image
  # build (and the Dockerfile itself) is only exercised AFTER merge, on the push
  # to main that also publishes. Build one arch, no push, to catch a broken
  # Dockerfile on the PR. Reads the amd64 publish cache but never writes it, so a
  # PR build can't evict main's cache entries.
  # Same-repo PRs skip this: the `docker` job below builds and publishes their
  # branch image, which covers the same ground.
  docker-build:
    needs: [checks, tests]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=linux-amd64

  # Required status check for branch protection on main: one job named
  # `quality` that is green only when every PR gate is. Keeps the protection
  # rule stable while the gates themselves can be split or renamed freely.
  quality:
    needs: [checks, tests, docker-build, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        run: |
          echo "checks=${{ needs.checks.result }} tests=${{ needs.tests.result }} docker-build=${{ needs.docker-build.result }} docker=${{ needs.docker.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.tests.result }}" = success
          # A PR runs exactly one image build: docker-build for forks, docker
          # (publishing the branch image) for branches in this repo.
          case "${{ needs.docker-build.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.docker.result }}" in success|skipped) ;; *) exit 1 ;; esac

  docker:
    needs: [checks, tests]
    # Publish from main, a v* tag, a PR opened from a branch in this repo, or a
    # manual (workflow_dispatch) run on any branch. Branch runs only get
    # :branch-<name> / :sha-<commit> tags (see the merge job). Fork PRs never
    # publish: their workflow token is read-only and their code is untrusted.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      # On a PR, build the branch head (what someone testing the branch expects),
      # not GitHub's synthetic merge commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # GHCR/OCI names must be lowercase - github.repository preserves the
      # owner's actual casing (e.g. OwenWright8/...), which buildx rejects.
      - name: Prepare env
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # A release tag that disagrees with package.json would publish :v1.2.3 of
      # a panel that reports itself as something else - refuse before pushing.
      - name: Release tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No tags here: push-by-digest uploads the layers and manifest without
      # claiming a tag, so the two arches cannot clobber each other's :latest.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # provenance=false: with push-by-digest the default provenance
          # attestation nests an extra manifest under each digest, which
          # `buildx imagetools create` then folds into the final list as
          # bogus unknown/unknown platform entries.
          provenance: false
          # Links the GHCR package to this repo (its page, README, permissions).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per arch - a shared gha cache key would have the two builds
          # overwriting each other's manifest. mode=max also exports the
          # Dockerfile's RUN cache mounts (pnpm store) so installs can be
          # skipped and the Tailwind/esbuild layer can cache-hit across runs.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [docker]
    permissions:
      contents: read
      packages: write
      pull-requests: write # the branch-image comment on a PR run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Which channel this run publishes to (see the header comment).
      - id: tags
        env:
          # A PR run's GITHUB_REF/GITHUB_SHA point at the synthetic merge ref;
          # tag by the branch and its head commit instead.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          image="ghcr.io/${IMAGE_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "primary=${image}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "args=-t ${image}:latest -t ${image}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            sha="sha-${GITHUB_SHA::7}"
            echo "primary=${image}:${sha}" >> "$GITHUB_OUTPUT"
            echo "args=-t ${image}:edge -t ${image}:${sha}" >> "$GITHUB_OUTPUT"
          else
            # A PR or manual run on a feature branch. Docker tags allow [a-z0-9_.-]
            # and at most 128 chars, so feat/pack-profiles -> branch-feat-pack-profiles.
            slug="$(printf '%s' "${BRANCH,,}" | tr -c 'a-z0-9_.-' '-' | sed -E 's/-+/-/g; s/^-|-$//g' | cut -c1-100)"
            sha="sha-${HEAD_SHA::7}"
            echo "primary=${image}:branch-${slug}" >> "$GITHUB_OUTPUT"
            echo "pinned=${image}:${sha}" >> "$GITHUB_OUTPUT"
            echo "args=-t ${image}:branch-${slug} -t ${image}:${sha}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.args }} \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}" \
            $(printf "ghcr.io/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.tags.outputs.primary }}"

      # One comment per PR, edited in place on every push (found by the hidden
      # marker), so the PR always shows the newest image without piling up.
      - name: Post the branch image on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
          PINNED: ${{ steps.tags.outputs.pinned }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- branch-image -->'
          body="$(cat <<MD
          ${marker}
          ### Branch image

          Built from ${HEAD_SHA::7} for linux/amd64 and linux/arm64 ([CI run](${RUN_URL})).

          | Tag | Moves |
          | --- | --- |
          | \`${PRIMARY}\` | On every push to this PR. |
          | \`${PINNED}\` | Never (this exact commit). |

          \`\`\`bash
          docker pull ${PRIMARY}
          \`\`\`

          In \`docker-compose.yml\`, set \`image: ${PRIMARY}\` and run \`docker compose up -d\`.
          MD
          )"
          id="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)"
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="${body}" >/dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="${body}" >/dev/null
          fi

  release:
    # Publish a GitHub Release for each pushed v* tag. Idempotent - re-running
    # the job for a tag that already has a release is a no-op. Notes come
    # straight from CHANGELOG.md. `needs: merge` so a version is only released
    # once its image is actually published - a release must never point at an
    # image that failed to build.
    needs: [merge]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # creates the release
    runs-on: ubuntu-latest
    steps:
      # Shallow clone is enough: the notes come from the working-tree
      # CHANGELOG.md and the release targets $GITHUB_SHA directly.
      - uses: actions/checkout@v7

      # The docker job already refused a tag that disagrees with package.json.
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        run: node scripts/changelog-notes.js "${{ steps.version.outputs.value }}" > release-notes.md

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.value }}"
          --title "v${{ steps.version.outputs.value }}"
          --notes-file release-notes.md
          --verify-tag
